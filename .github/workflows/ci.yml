name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: Build, types, lint, package
    runs-on: ubuntu-latest
    steps:
      - uses: holepunchto/actions/checkout@146b86c4d0237c124df06ecc992ddf2c585b3405 # v1
      - uses: holepunchto/actions/setup-node@146b86c4d0237c124df06ecc992ddf2c585b3405 # v1
        with:
          version: 24.x
      - run: npm ci
      - run: npm run build && npm run build:test && npm run test:types
      - run: npm run lint
      - run: npm run test:release-tag
      - uses: holepunchto/actions/setup-bare@146b86c4d0237c124df06ecc992ddf2c585b3405 # v1
      - run: bare --version
      - run: npm run test:package

  node:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22.x, 24.x]
    steps:
      - uses: holepunchto/actions/checkout@146b86c4d0237c124df06ecc992ddf2c585b3405 # v1
      - uses: holepunchto/actions/setup-node@146b86c4d0237c124df06ecc992ddf2c585b3405 # v1
        with:
          version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run test:node

  bare:
    name: Bare / ${{ matrix.os }}
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: holepunchto/actions/checkout@146b86c4d0237c124df06ecc992ddf2c585b3405 # v1
      - uses: holepunchto/actions/setup-node@146b86c4d0237c124df06ecc992ddf2c585b3405 # v1
        with:
          version: 24.x
      - run: npm ci
      - uses: holepunchto/actions/setup-bare@146b86c4d0237c124df06ecc992ddf2c585b3405 # v1
      - run: bare --version
      - run: npm run test:bare

  property:
    name: Protocol property test
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: holepunchto/actions/checkout@146b86c4d0237c124df06ecc992ddf2c585b3405 # v1
      - uses: holepunchto/actions/setup-node@146b86c4d0237c124df06ecc992ddf2c585b3405 # v1
        with:
          version: 24.x
      - run: npm ci
      - run: npm run build && npm run build:test
      - run: npx brittle-node .test-dist/unit/protocol-property.test.js
