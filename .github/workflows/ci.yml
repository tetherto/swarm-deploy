name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: holepunchto/actions/checkout@v1
      - uses: holepunchto/actions/setup-node@v1
        with:
          version: lts/*
      - run: npm ci
      - run: npm run lint

  node:
    name: Node / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: holepunchto/actions/checkout@v1
      - uses: holepunchto/actions/setup-node@v1
        with:
          version: lts/*
      - run: npm ci
      - run: npm run test:node

  bare:
    name: Bare / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: holepunchto/actions/checkout@v1
      - uses: holepunchto/actions/setup-node@v1
        with:
          version: lts/*
      - run: npm ci
      - uses: holepunchto/actions/setup-bare@v1
      - run: npm run test:bare

  property:
    name: Protocol property test
    runs-on: ubuntu-latest
    steps:
      - uses: holepunchto/actions/checkout@v1
      - uses: holepunchto/actions/setup-node@v1
        with:
          version: lts/*
      - run: npm ci
      - run: npx brittle-node test/unit/protocol-property.test.js
