name: Publish

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm
    env:
      NPM_CONFIG_PROVENANCE: 'true'
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: holepunchto/actions/checkout@146b86c4d0237c124df06ecc992ddf2c585b3405 # v1
        with:
          fetch-depth: 0
      - uses: holepunchto/actions/setup-node@146b86c4d0237c124df06ecc992ddf2c585b3405 # v1
        with:
          version: 24.x
          registry-url: https://registry.npmjs.org
      - name: Validate release tag
        run: node scripts/validate-release-tag.mjs
      - name: Verify tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm ci
      - name: Build untracked distribution
        run: |
          test ! -e dist
          npm run build
      - run: npm run test:types
      - run: npm run validate:package
      - run: npm run test:package
      - uses: holepunchto/actions/publish@v1
